    <div id="cap-0" class="clip cap" data-start="0.70" data-duration="3.23" style="" data-layout-allow-caption-zone><span>Every twenty-seven minutes, someone in Goa is bitten by a dog.</span></div>
    <div id="cap-1" class="clip cap" data-start="4.70" data-duration="5.92" style="" data-layout-allow-caption-zone><span>In 2025 alone, that was nineteen thousand, three hundred and sixty-eight bite cases.</span></div>
    <div id="cap-2" class="clip cap" data-start="11.90" data-duration="3.58" style="" data-layout-allow-caption-zone><span>And when you find an injured animal on the road, who do you even call?</span></div>

    <div id="cap-5" class="clip cap" data-start="21.10" data-duration="5.91" style="" data-layout-allow-caption-zone><span>And last year, Canacona, Sankhalim, Valpoi and Mapusa held no sterilisation camps at all.</span></div>
    <div id="cap-6" class="clip cap" data-start="28.30" data-duration="5.05" style="" data-layout-allow-caption-zone><span>Meet PawSOS Goa: one WhatsApp number for every animal emergency in the state.</span></div>

    <div id="cap-9" class="clip cap" data-start="36.83" data-duration="3.34" style="" data-layout-allow-caption-zone><span>You send a photo of the animal, and your location.</span></div>
    <div id="cap-10" class="clip cap" data-start="40.70" data-duration="7.96" style="" data-layout-allow-caption-zone><span>Within seconds, Claude looks at the photo and replies: how urgent it seems, and two or three safe things to do while you wait.</span></div>
    <div id="cap-11" class="clip cap" data-start="48.66" data-duration="2.15" style="" data-layout-allow-caption-zone><span>It is guidance, never a diagnosis.</span></div>
    <div id="cap-12" class="clip cap" data-start="51.50" data-duration="6.03" style="" data-layout-allow-caption-zone><span>If someone else reports the same animal nearby, PawSOS merges it into the same case.</span></div>

    <div id="cap-14" class="clip cap" data-start="60.60" data-duration="5.35" style="" data-layout-allow-caption-zone><span>The nearest partner team gets the photo, a map link, and two buttons: accept, or decline.</span></div>
    <div id="cap-15" class="clip cap" data-start="66.60" data-duration="5.45" style="" data-layout-allow-caption-zone><span>If nobody answers in time, the case moves on to the next team, and then to the taluka officer.</span></div>
